name: CI & Self-Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run Test Suite
        run: |
          python -m unittest tests/test_engine.py

      - name: Dogfood AgentSec Self-Audit
        run: |
          agentsec scan sample_agent_fixed.json
